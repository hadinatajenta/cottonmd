name: Release Build (macOS + Windows + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build & package Windows portable zip
        shell: pwsh
        run: .\scripts\bundle-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CottonMD-windows-x64
          path: dist/CottonMD-windows-x64.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build release & package app
        run: |
          cargo build --release -p cottonmd-desktop -p cottonmd-cli
          mkdir -p dist/CottonMD.app/Contents/MacOS dist/CottonMD.app/Contents/Resources
          cp target/release/CottonMD dist/CottonMD.app/Contents/MacOS/
          cp target/release/cottonmd-cli dist/CottonMD.app/Contents/MacOS/
          cp assets/AppIcon.icns dist/CottonMD.app/Contents/Resources/
          cat > dist/CottonMD.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key><string>CottonMD</string>
              <key>CFBundleExecutable</key><string>CottonMD</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundleIdentifier</key><string>dev.cottonmd.app</string>
              <key>CFBundleName</key><string>CottonMD</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - dist/CottonMD.app
          ditto -c -k --sequesterRsrc --keepParent dist/CottonMD.app dist/CottonMD-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CottonMD-macos-arm64
          path: dist/CottonMD-macos-arm64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build release & archive
        run: |
          cargo build --release -p cottonmd-desktop -p cottonmd-cli
          mkdir -p dist/cottonmd-linux-x64
          cp target/release/CottonMD target/release/cottonmd-cli dist/cottonmd-linux-x64/
          tar -czf dist/CottonMD-linux-x64.tar.gz -C dist cottonmd-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CottonMD-linux-x64
          path: dist/CottonMD-linux-x64.tar.gz
