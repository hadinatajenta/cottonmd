name: Release Build (macOS + Windows + Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build & package Windows portable zip
        shell: pwsh
        run: .\scripts\bundle-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CottonMD-windows-x64
          path: dist/CottonMD-windows-x64.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build release & package app + DMG
        run: |
          cargo build --release -p cottonmd-desktop -p cottonmd-cli
          mkdir -p dist/dmg-stage/CottonMD.app/Contents/MacOS dist/dmg-stage/CottonMD.app/Contents/Resources
          cp target/release/CottonMD dist/dmg-stage/CottonMD.app/Contents/MacOS/
          cp target/release/cottonmd-cli dist/dmg-stage/CottonMD.app/Contents/MacOS/
          cp assets/AppIcon.icns dist/dmg-stage/CottonMD.app/Contents/Resources/
          cat > dist/dmg-stage/CottonMD.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleDisplayName</key><string>CottonMD</string>
              <key>CFBundleExecutable</key><string>CottonMD</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundleIdentifier</key><string>dev.cottonmd.app</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>CottonMD</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>0.1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - dist/dmg-stage/CottonMD.app
          ditto -c -k --sequesterRsrc --keepParent dist/dmg-stage/CottonMD.app dist/CottonMD-macos-arm64.zip
          ln -s /Applications dist/dmg-stage/Applications
          hdiutil create -volname "CottonMD" -srcfolder dist/dmg-stage -ov -format UDZO dist/CottonMD-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CottonMD-macos-arm64
          path: |
            dist/CottonMD-macos-arm64.zip
            dist/CottonMD-macos-arm64.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Build release & archive
        run: |
          cargo build --release -p cottonmd-desktop -p cottonmd-cli
          mkdir -p dist/cottonmd-linux-x64
          cp target/release/CottonMD target/release/cottonmd-cli dist/cottonmd-linux-x64/
          tar -czf dist/CottonMD-linux-x64.tar.gz -C dist cottonmd-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CottonMD-linux-x64
          path: dist/CottonMD-linux-x64.tar.gz

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## CottonMD — Pure-Rust Local-First Markdown Knowledge Workspace

          Lightweight desktop PKM application written in pure Rust (`egui` + `eframe`), without Electron or WebView.

          ### Highlights
          - **Local-first Markdown Vault:** Hierarchical file explorer, native OS folder picker, Quick Switcher (`Cmd/Ctrl+K`), Global Search, Tags, and Inspector (Backlinks, Outgoing/Unresolved Links, Outline, YAML Properties, interactive Tasks).
          - **Editor, Split & Preview (`Cmd/Ctrl+E`):** Clean writing surface with native preview for headings, YAML properties, callouts, code blocks, clickable `[[wikilinks]]`, `#tags`, and interactive task checkboxes.
          - **Interactive Graph View (`Cmd/Ctrl+G`):** Force-directed physics with pan, zoom, node dragging, and click-to-open.
          - **Bases Table (`Cmd/Ctrl+B`):** Filterable, sortable tabular view over vault notes with CSV export.
          - **JSON Canvas Viewer (`.canvas`):** Pan/zoom renderer for JSON Canvas 1.0 documents.
          - **Companion CLI (`cottonmd-cli`):** Bundled headless CLI for scripting vault queries.
          - **Custom Liquid Glass Icon:** Native Retina `AppIcon.icns` (macOS) & multi-resolution `AppIcon.ico` (Windows).

          ### Downloads
          - **macOS (Apple Silicon):** `CottonMD-macos-arm64.dmg` or `CottonMD-macos-arm64.zip`
          - **Windows (x64 Portable):** `CottonMD-windows-x64.zip` (`CottonMD.exe` + `cottonmd-cli.exe`)
          - **Linux (x64):** `CottonMD-linux-x64.tar.gz`

          > **Note on unsigned binaries:** macOS builds are ad-hoc signed; if Gatekeeper prompts on first launch, right-click `CottonMD.app` -> **Open** (or run `xattr -cr /Applications/CottonMD.app`).
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" release-assets/* \
              --title "CottonMD $TAG" \
              --notes-file /tmp/release-notes.md
          fi
